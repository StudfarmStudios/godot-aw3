name: 🧪 WebGPU Tests
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [aw-web-export]
    paths:
      - '.github/workflows/webgpu_tests.yml'
      - 'drivers/webgpu/**'
      - 'webgpu_tests/**'
      - 'servers/rendering/**'
  pull_request:
    paths:
      - '.github/workflows/webgpu_tests.yml'
      - 'drivers/webgpu/**'
      - 'webgpu_tests/**'
      - 'servers/rendering/**'

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    tests=no
    debug_symbols=no
  EM_VERSION: 4.0.11

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Shader Corpus: SPIR-V → WGSL validation with the candidate translator
  # ═══════════════════════════════════════════════════════════════════════════════
  shader-corpus:
    runs-on: ubuntu-24.04
    name: Candidate Tint Translation Corpus
    needs: [build-webgpu]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install glslangValidator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          command -v glslang || sudo ln -s /usr/bin/glslangValidator /usr/local/bin/glslang

      - name: Download candidate Tint CLI
        uses: actions/download-artifact@v4
        with:
          name: candidate-tint-cli
          path: bin/

      - name: Validate candidate translator and semantic guards
        run: |
          chmod +x bin/tint_convert_cli
          test -x bin/tint_convert_cli
          python3 webgpu_tests/tint_translation/run_translation.py --tint bin/tint_convert_cli --output /tmp/tint-translation
          python3 webgpu_tests/tint_translation/run_operand_guards.py --tint bin/tint_convert_cli --corpus /tmp/tint-translation --output /tmp/tint-operand-guards

      - name: Upload WGSL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-corpus-results
          path: |
            /tmp/tint-translation/
            /tmp/tint-operand-guards/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # Driver Unit Tests: Algorithmic correctness of WebGPU driver subsystems
  # ═══════════════════════════════════════════════════════════════════════════════
  driver-unit-tests:
    runs-on: ubuntu-24.04
    name: Driver Unit Tests (JS)
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run driver unit tests
        working-directory: webgpu_tests/driver_unit_tests
        run: node run_tests.mjs

  # ═══════════════════════════════════════════════════════════════════════════════
  # Engine Build: Compile WebGPU export template + strict shader precompile
  # ═══════════════════════════════════════════════════════════════════════════════
  build-webgpu:
    runs-on: ubuntu-24.04
    name: Build Candidate WebGPU Template + Strict Shader Bake
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: web-webgpu-test
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Install native shader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config glslang-tools spirv-tools

      - name: Build WebGPU export template
        # The shared godot-build action deletes editor/ for template builds.
        # This job still needs that source for the headless export editor below.
        run: |
          scons platform=web target=template_release $SCONS_FLAGS threads=no dlink_enabled=no webgpu=yes opengl3=no \
            cache_path="${{ github.workspace }}/.scons_cache/" redirect_build_objects=no -j$(nproc)

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: web-webgpu-test
        continue-on-error: true

      - name: Build headless Linux export editor
        run: |
          scons platform=linuxbsd target=editor dev_mode=yes tests=no debug_symbols=no x11=no wayland=no vulkan=no opengl3=no webgpu=no -j$(nproc)

      - name: Export with the exact candidate template
        run: |
          python3 webgpu_tests/browser_fork_ports/export_candidate.py \
            bin/godot.linuxbsd.editor.x86_64 \
            --template bin/godot.web.template_release.wasm32.nothreads.zip \
            --project webgpu_tests/test_project \
            --output /tmp/webgpu-candidate

      - name: Upload candidate Tint CLI
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tint-cli
          path: bin/tint_convert_cli
          if-no-files-found: error
          retention-days: 7

      - name: Upload WebGPU export
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-export
          path: /tmp/webgpu-candidate/export/
          if-no-files-found: error
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # Smoke Test: Run exported project in headless Chrome
  # ═══════════════════════════════════════════════════════════════════════════════
  smoke-test:
    runs-on: ubuntu-24.04
    name: Candidate Chrome Smoke Test (Xvfb)
    needs: [build-webgpu]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WebGPU export
        uses: actions/download-artifact@v4
        with:
          name: webgpu-export
          path: webgpu_tests/test_project/export/

      - name: Install Playwright
        run: |
          cd webgpu_tests/test_project
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run smoke test
        working-directory: webgpu_tests/test_project
        run: xvfb-run -a node smoke_test.mjs ./export/

  # ═══════════════════════════════════════════════════════════════════════════════
  # Scene Smoketest: 18 demos/benchmarks across Chrome + Firefox
  # ═══════════════════════════════════════════════════════════════════════════════
  scene-smoketest:
    # Existing external/prebuilt demos are manual diagnostics, not candidate proof.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: Scene Smoketest (Chrome + Firefox)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        run: |
          cd webgpu_tests/scene_smoketest
          npm install
          npx playwright install chromium firefox --with-deps

      - name: Run scene smoketest (Chrome)
        working-directory: webgpu_tests/scene_smoketest
        run: node run_scenes.mjs --browser chrome --timeout 30000

      - name: Run scene smoketest (Firefox)
        working-directory: webgpu_tests/scene_smoketest
        run: node run_scenes.mjs --browser firefox --timeout 30000

  # ═══════════════════════════════════════════════════════════════════════════════
  # Resource Lifecycle: Browser-based stress test
  # ═══════════════════════════════════════════════════════════════════════════════
  resource-lifecycle:
    # Existing external/prebuilt demos are manual diagnostics, not candidate proof.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: Resource Lifecycle (Chrome WebGPU)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd webgpu_tests/resource_lifecycle
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run resource lifecycle stress tests
        working-directory: webgpu_tests/resource_lifecycle
        run: node run_tests.mjs

  # ═══════════════════════════════════════════════════════════════════════════════
  # Screenshot Comparison: Multi-browser visual regression
  # ═══════════════════════════════════════════════════════════════════════════════
  screenshot-comparison:
    # Existing external/prebuilt demos are manual diagnostics, not candidate proof.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: Screenshot Comparison (Chrome + Firefox)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        run: |
          cd webgpu_tests/screenshot_comparison
          npm init -y
          npm install playwright
          npx playwright install chromium firefox --with-deps

      - name: Run screenshot tests
        working-directory: webgpu_tests/screenshot_comparison
        run: node screenshot_tests.mjs --update-baselines
        # First run creates baselines. On subsequent runs after baselines are committed,
        # change to: node screenshot_tests.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-comparison
          path: webgpu_tests/screenshot_comparison/screenshots/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════════════════════════
  test-summary:
    runs-on: ubuntu-24.04
    name: Test Summary
    needs: [build-webgpu, shader-corpus, driver-unit-tests, smoke-test, scene-smoketest, resource-lifecycle, screenshot-comparison]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           WebGPU Test Suite Results                      ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Shader Corpus:        ${{ needs.shader-corpus.result }}"
          echo "  Driver Unit Tests:    ${{ needs.driver-unit-tests.result }}"
          echo "  Candidate Build:      ${{ needs.build-webgpu.result }}"
          echo "  Smoke Test:           ${{ needs.smoke-test.result }}"
          echo "  Scene Smoketest:      ${{ needs.scene-smoketest.result }}"
          echo "  Resource Lifecycle:   ${{ needs.resource-lifecycle.result }}"
          echo "  Screenshot Compare:   ${{ needs.screenshot-comparison.result }}"
          echo ""

          FAILED=0

          if [ "${{ needs.shader-corpus.result }}" != "success" ]; then
            echo "::error::Shader corpus tests failed"
            FAILED=1
          fi
          if [ "${{ needs.driver-unit-tests.result }}" != "success" ]; then
            echo "::error::Driver unit tests failed"
            FAILED=1
          fi
          if [ "${{ needs.build-webgpu.result }}" != "success" ]; then
            echo "::error::Candidate WebGPU build, strict shader bake, or export failed"
            FAILED=1
          fi
          if [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "::error::Headless smoke test failed — shader compilation or WebGPU errors in browser"
            FAILED=1
          fi
          if [ "${{ needs.scene-smoketest.result }}" = "failure" ]; then
            echo "::error::Scene smoketest failed — one or more scenes have GPU/shader errors in Chrome or Firefox"
            FAILED=1
          fi
          if [ "${{ needs.resource-lifecycle.result }}" = "failure" ]; then
            echo "::error::Resource lifecycle tests failed"
            FAILED=1
          fi
          # Screenshot comparison failures are warnings, not blockers
          if [ "${{ needs.screenshot-comparison.result }}" = "failure" ]; then
            echo "::warning::Screenshot comparison detected visual differences"
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
