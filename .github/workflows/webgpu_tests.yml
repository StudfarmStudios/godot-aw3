name: 🧪 WebGPU Tests
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      reuse_export_run_id:
        description: 'Diagnostic only: reuse a prior webgpu-export artifact from this repository'
        type: string
        required: false
        default: ''
  push:
    branches: [aw-web-export]
    paths:
      - '.github/workflows/webgpu_tests.yml'
      - 'drivers/webgpu/**'
      - 'webgpu_tests/**'
      - 'servers/rendering/**'
      - 'platform/web/js/engine/**'
      - 'platform/web/js/libs/library_godot_audio*'
  pull_request:
    paths:
      - '.github/workflows/webgpu_tests.yml'
      - 'drivers/webgpu/**'
      - 'webgpu_tests/**'
      - 'servers/rendering/**'
      - 'platform/web/js/engine/**'
      - 'platform/web/js/libs/library_godot_audio*'

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    tests=no
    debug_symbols=no
  EM_VERSION: 4.0.20
  PLAYWRIGHT_VERSION: 1.64.0

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # Shader Corpus: SPIR-V → WGSL validation with the candidate translator
  # ═══════════════════════════════════════════════════════════════════════════════
  shader-corpus:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_export_run_id == ''
    runs-on: ubuntu-24.04
    name: Candidate Tint Translation Corpus
    needs: [build-webgpu]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install glslangValidator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          command -v glslang || sudo ln -s /usr/bin/glslangValidator /usr/local/bin/glslang

      - name: Download candidate Tint CLI
        uses: actions/download-artifact@v4
        with:
          name: candidate-tint-cli
          path: bin/

      - name: Validate candidate translator and semantic guards
        run: |
          chmod +x bin/tint_convert_cli
          test -x bin/tint_convert_cli
          python3 webgpu_tests/tint_translation/run_translation.py --tint bin/tint_convert_cli --output /tmp/tint-translation
          python3 webgpu_tests/tint_translation/run_operand_guards.py --tint bin/tint_convert_cli --corpus /tmp/tint-translation --output /tmp/tint-operand-guards

      - name: Upload WGSL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-corpus-results
          path: |
            /tmp/tint-translation/
            /tmp/tint-operand-guards/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # Driver Unit Tests: Algorithmic correctness of WebGPU driver subsystems
  # ═══════════════════════════════════════════════════════════════════════════════
  driver-unit-tests:
    runs-on: ubuntu-24.04
    name: Driver Unit Tests (JS)
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run driver unit tests
        working-directory: webgpu_tests/driver_unit_tests
        run: node run_tests.mjs

      - name: Verify software browser capability and smoke gates
        run: node --test webgpu_tests/test_project/browser_config.test.mjs webgpu_tests/test_project/smoke_test.test.mjs

      - name: Verify audio bridge routing without pthread-only globals
        run: node --test platform/web/js/libs/library_godot_audio.test.mjs

  # ═══════════════════════════════════════════════════════════════════════════════
  # Engine Build: Compile WebGPU export template + strict shader precompile
  # ═══════════════════════════════════════════════════════════════════════════════
  build-webgpu:
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_export_run_id == ''
    runs-on: ubuntu-24.04
    name: Build Candidate WebGPU Template + Strict Shader Bake
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          no-cache: true

      - name: Verify Emscripten setup
        run: emcc -v

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: web-webgpu-test
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Install native shader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config glslang-tools spirv-tools

      - name: Prebuild native Tint CLI
        # A cold host build must not compete with SCons' Wasm compiler jobs.
        # The bounded SCons invocation then only checks inputs and relinks.
        timeout-minutes: 30
        run: bash drivers/webgpu/tint_cli/build.sh

      - name: Build WebGPU export template
        # The shared godot-build action deletes editor/ for template builds.
        # This job still needs that source for the headless export editor below.
        run: |
          scons platform=web target=template_release $SCONS_FLAGS threads=no dlink_enabled=no webgpu=yes opengl3=no use_closure_compiler=yes \
            cache_path="${{ github.workspace }}/.scons_cache/" redirect_build_objects=no -j$(nproc)

      - name: Build headless Linux export editor
        run: |
          scons platform=linuxbsd target=editor dev_mode=yes tests=no debug_symbols=no x11=no wayland=no vulkan=no opengl3=no webgpu=no \
            cache_path="${{ github.workspace }}/.scons_cache/" redirect_build_objects=no -j$(nproc)

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: web-webgpu-test
        continue-on-error: true

      - name: Export with the exact candidate template
        run: |
          python3 webgpu_tests/browser_fork_ports/export_candidate.py \
            bin/godot.linuxbsd.editor.x86_64 \
            --template bin/godot.web.template_release.wasm32.nothreads.zip \
            --project webgpu_tests/test_project \
            --canvas-resize-policy 2 \
            --output /tmp/webgpu-candidate

      - name: Upload candidate Tint CLI
        uses: actions/upload-artifact@v4
        with:
          name: candidate-tint-cli
          path: bin/tint_convert_cli
          if-no-files-found: error
          retention-days: 7

      - name: Upload WebGPU export
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-export
          path: /tmp/webgpu-candidate/export/
          if-no-files-found: error
          retention-days: 7

  # Check the software adapter independently of the long candidate build.
  software-preflight:
    runs-on: ubuntu-24.04
    name: SwiftShader Forward+ Capability Preflight
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned software browser
        working-directory: webgpu_tests/test_project
        run: |
          npm install --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install chromium --with-deps

      - name: Exercise Forward+ binding limits
        working-directory: webgpu_tests/test_project
        env:
          DEBUG: pw:browser
        run: |
          set -o pipefail
          xvfb-run -a node preflight.mjs 2>&1 | tee preflight.log

      - name: Upload capability diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-preflight-diagnostics
          path: webgpu_tests/test_project/preflight.log
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # Smoke Test: Candidate runtime on SwiftShader software Vulkan, not hardware validation
  # ═══════════════════════════════════════════════════════════════════════════════
  smoke-test:
    runs-on: ubuntu-24.04
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id != '' && 'Diagnostic Reused Export Smoke Test (SwiftShader + Xvfb)' || 'Candidate Chrome Software Smoke Test (SwiftShader + Xvfb)' }}
    needs: [build-webgpu, software-preflight]
    if: >-
      ${{ !cancelled() && needs.software-preflight.result == 'success' &&
          (needs.build-webgpu.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id != '' && needs.build-webgpu.result == 'skipped')) }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record export artifact provenance
        id: export-source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id || github.run_id }}
          REUSED_EXPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id != '' }}
        run: |
          if [[ ! "$EXPORT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::reuse_export_run_id must contain only digits"
            exit 1
          fi
          mkdir -p webgpu_tests/test_project/smoke-diagnostics
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPORT_SOURCE_RUN_ID" > /tmp/export-source-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$EXPORT_SOURCE_RUN_ID/artifacts?per_page=100" > /tmp/export-source-artifacts.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("/tmp/export-source-run.json").read_text())
          pages = json.loads(Path("/tmp/export-source-artifacts.json").read_text())
          if run["repository"]["full_name"].lower() != os.environ["GITHUB_REPOSITORY"].lower():
              raise SystemExit("Export source must belong to this repository")
          if str(run["id"]) != os.environ["EXPORT_SOURCE_RUN_ID"]:
              raise SystemExit("Export source run ID mismatch")
          artifacts = [artifact for page in pages for artifact in page["artifacts"]
                       if artifact["name"] == "webgpu-export" and not artifact["expired"]]
          if not artifacts:
              raise SystemExit("Source run has no nonexpired webgpu-export artifact")
          artifact = max(artifacts, key=lambda item: item["id"])
          reused = os.environ["REUSED_EXPORT"] == "true"
          provenance = {
              "mode": "reused-export-diagnostic" if reused else "current-run-candidate",
              "exact_head_acceptance": not reused,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "harness_run_id": os.environ["GITHUB_RUN_ID"],
              "harness_head_sha": os.environ["GITHUB_SHA"],
              "source_run": {key: run.get(key) for key in (
                  "id", "html_url", "head_sha", "head_branch", "run_attempt", "event", "path",
              )},
              "artifact": {key: artifact.get(key) for key in (
                  "id", "name", "digest", "size_in_bytes", "created_at", "workflow_run",
              )},
          }
          Path("webgpu_tests/test_project/smoke-diagnostics/export-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("artifact_id=" + str(artifact["id"]) + "\n")
          print(json.dumps(provenance, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### " + provenance["mode"] + "\n\nSource run: " + run["html_url"] + "\n\n")
              if reused:
                  summary.write("Reused export diagnostic only; this is not exact-head candidate acceptance.\n")
          PY

      - name: Download identified WebGPU export
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.export-source.outputs.artifact_id }}
          merge-multiple: true
          path: webgpu_tests/test_project/export/
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Hash downloaded export files
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("webgpu_tests/test_project")
          path = root / "smoke-diagnostics/export-provenance.json"
          provenance = json.loads(path.read_text())
          provenance["files"] = {}
          for name in ("index.html", "index.js", "index.wasm", "index.pck"):
              data = (root / "export" / name).read_bytes()
              if not data:
                  raise SystemExit("Empty export file: " + name)
              provenance["files"][name] = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          path.write_text(json.dumps(provenance, indent=2) + "\n")
          print(json.dumps(provenance["files"], indent=2))
          PY

      - name: Install Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          cd webgpu_tests/test_project
          npm init -y
          npm install playwright@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install chromium --with-deps

      - name: Run candidate software WebGPU smoke test
        working-directory: webgpu_tests/test_project
        env:
          DEBUG: pw:browser
          VERBOSE: '1'
        run: |
          set -o pipefail
          mkdir -p smoke-diagnostics
          snapshot_host() {
            {
              date --iso-8601=seconds
              free -m
              cat /proc/meminfo
            } > "smoke-diagnostics/host-$1.log" 2>&1 || true
            timeout 10s sudo -n dmesg --level=err,warn --time-format=iso \
              > "smoke-diagnostics/kernel-$1.log" 2>&1 || true
          }
          sampler_pid=""
          cleanup_diagnostics() {
            smoke_status=$?
            trap - EXIT
            if [ -n "$sampler_pid" ]; then
              kill "$sampler_pid" 2>/dev/null || true
              wait "$sampler_pid" || true
            fi
            snapshot_host after
            exit "$smoke_status"
          }
          trap cleanup_diagnostics EXIT
          snapshot_host before
          # Bound the sampler independently and reap it on every smoke exit.
          python3 - <<'PY' > smoke-diagnostics/resources.jsonl 2>&1 &
          import datetime
          import json
          import pathlib
          import signal
          import subprocess
          import threading
          import time

          stopped = threading.Event()
          signal.signal(signal.SIGTERM, lambda *_: stopped.set())
          signal.signal(signal.SIGINT, lambda *_: stopped.set())
          cgroup_root = pathlib.Path("/sys/fs/cgroup")
          cgroups = [cgroup_root]

          def read(path):
              try:
                  return pathlib.Path(path).read_text().strip()
              except OSError as error:
                  return str(error)

          membership = read("/proc/self/cgroup")
          for line in membership.splitlines():
              if line.startswith("0::"):
                  path = (cgroup_root / line[3:].lstrip("/")).resolve()
                  if path.is_relative_to(cgroup_root) and path.is_dir() and path not in cgroups:
                      cgroups.append(path)

          def sample(phase):
              record = {"time": datetime.datetime.now(datetime.timezone.utc).isoformat(), "phase": phase}
              record["cpu_stat"] = read("/proc/stat")
              record["meminfo"] = read("/proc/meminfo")
              record["pressure"] = {name: read("/proc/pressure/" + name) for name in ("cpu", "memory", "io")}
              record["cgroup_membership"] = membership
              record["cgroups"] = {str(path): {name: read(path / name) for name in (
                  "memory.current", "memory.peak", "memory.max", "memory.events", "memory.events.local",
                  "memory.swap.current", "cpu.stat",
              )} for path in cgroups}
              try:
                  # Never record command arguments or environment variables.
                  result = subprocess.run(["ps", "-eo", "pid,ppid,pcpu,rss,vsz,etime,comm", "--sort=-rss"],
                                          capture_output=True, text=True, timeout=5, check=False)
                  record["processes"] = result.stdout
                  record["ps_error"] = result.stderr
                  record["ps_status"] = result.returncode
              except subprocess.TimeoutExpired:
                  record["ps_error"] = "ps exceeded five seconds"
              print(json.dumps(record), flush=True)

          deadline = time.monotonic() + 1860
          try:
              while not stopped.is_set() and time.monotonic() < deadline:
                  sample("running")
                  stopped.wait(5)
          finally:
              sample("final")
          PY
          sampler_pid=$!
          xvfb-run -a node smoke_test.mjs ./export/ 2>&1 | tee smoke.log

      - name: Upload complete software smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-smoke-diagnostics
          path: |
            webgpu_tests/test_project/smoke.log
            webgpu_tests/test_project/smoke-result.json
            webgpu_tests/test_project/smoke-diagnostics/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # Scene Smoketest: 18 demos/benchmarks across Chrome + Firefox
  # ═══════════════════════════════════════════════════════════════════════════════
  scene-smoketest:
    # Existing external/prebuilt demos are manual diagnostics, not candidate proof.
    if: github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id == ''
    runs-on: ubuntu-24.04
    name: Scene Smoketest (Chrome + Firefox)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        run: |
          cd webgpu_tests/scene_smoketest
          npm install
          npx playwright install chromium firefox --with-deps

      - name: Run scene smoketest (Chrome)
        working-directory: webgpu_tests/scene_smoketest
        run: node run_scenes.mjs --browser chrome --timeout 30000

      - name: Run scene smoketest (Firefox)
        working-directory: webgpu_tests/scene_smoketest
        run: node run_scenes.mjs --browser firefox --timeout 30000

  # ═══════════════════════════════════════════════════════════════════════════════
  # Resource Lifecycle: Browser-based stress test
  # ═══════════════════════════════════════════════════════════════════════════════
  resource-lifecycle:
    # Existing external/prebuilt demos are manual diagnostics, not candidate proof.
    if: github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id == ''
    runs-on: ubuntu-24.04
    name: Resource Lifecycle (Chrome WebGPU)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd webgpu_tests/resource_lifecycle
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run resource lifecycle stress tests
        working-directory: webgpu_tests/resource_lifecycle
        run: node run_tests.mjs

  # ═══════════════════════════════════════════════════════════════════════════════
  # Screenshot Comparison: Multi-browser visual regression
  # ═══════════════════════════════════════════════════════════════════════════════
  screenshot-comparison:
    # Existing external/prebuilt demos are manual diagnostics, not candidate proof.
    if: github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id == ''
    runs-on: ubuntu-24.04
    name: Screenshot Comparison (Chrome + Firefox)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and browsers
        run: |
          cd webgpu_tests/screenshot_comparison
          npm init -y
          npm install playwright
          npx playwright install chromium firefox --with-deps

      - name: Run screenshot tests
        working-directory: webgpu_tests/screenshot_comparison
        run: node screenshot_tests.mjs --update-baselines
        # First run creates baselines. On subsequent runs after baselines are committed,
        # change to: node screenshot_tests.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-comparison
          path: webgpu_tests/screenshot_comparison/screenshots/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════════
  # Summary
  # ═══════════════════════════════════════════════════════════════════════════════
  test-summary:
    runs-on: ubuntu-24.04
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id != '' && 'Diagnostic Reused Export Summary' || 'Test Summary' }}
    needs: [build-webgpu, shader-corpus, driver-unit-tests, software-preflight, smoke-test, scene-smoketest, resource-lifecycle, screenshot-comparison]
    if: always()
    steps:
      - name: Check results
        env:
          REUSED_EXPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_export_run_id != '' }}
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           WebGPU Test Suite Results                      ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Shader Corpus:        ${{ needs.shader-corpus.result }}"
          echo "  Driver Unit Tests:    ${{ needs.driver-unit-tests.result }}"
          echo "  Candidate Build:      ${{ needs.build-webgpu.result }}"
          echo "  Software Preflight:   ${{ needs.software-preflight.result }}"
          echo "  Smoke Test:           ${{ needs.smoke-test.result }}"
          echo "  Scene Smoketest:      ${{ needs.scene-smoketest.result }}"
          echo "  Resource Lifecycle:   ${{ needs.resource-lifecycle.result }}"
          echo "  Screenshot Compare:   ${{ needs.screenshot-comparison.result }}"
          echo ""

          FAILED=0
          EXPECTED_BUILD_RESULT=success
          if [ "$REUSED_EXPORT" = "true" ]; then
            EXPECTED_BUILD_RESULT=skipped
            echo "::notice::Reused export diagnostic only; not exact-head candidate acceptance"
            echo "Reused export diagnostic only; not exact-head candidate acceptance." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.shader-corpus.result }}" != "$EXPECTED_BUILD_RESULT" ]; then
            echo "::error::Shader corpus tests failed"
            FAILED=1
          fi
          if [ "${{ needs.driver-unit-tests.result }}" != "success" ]; then
            echo "::error::Driver unit tests failed"
            FAILED=1
          fi
          if [ "${{ needs.build-webgpu.result }}" != "$EXPECTED_BUILD_RESULT" ]; then
            echo "::error::Candidate WebGPU build, strict shader bake, or export failed"
            FAILED=1
          fi
          if [ "${{ needs.software-preflight.result }}" != "success" ]; then
            echo "::error::Software browser cannot exercise required Forward+ limits"
            FAILED=1
          fi
          if [ "${{ needs.smoke-test.result }}" != "success" ]; then
            echo "::error::Headless smoke test failed — shader compilation or WebGPU errors in browser"
            FAILED=1
          fi
          if [ "${{ needs.scene-smoketest.result }}" = "failure" ]; then
            echo "::error::Scene smoketest failed — one or more scenes have GPU/shader errors in Chrome or Firefox"
            FAILED=1
          fi
          if [ "${{ needs.resource-lifecycle.result }}" = "failure" ]; then
            echo "::error::Resource lifecycle tests failed"
            FAILED=1
          fi
          # Screenshot comparison failures are warnings, not blockers
          if [ "${{ needs.screenshot-comparison.result }}" = "failure" ]; then
            echo "::warning::Screenshot comparison detected visual differences"
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
