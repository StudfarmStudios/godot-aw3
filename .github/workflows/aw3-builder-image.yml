# Builds and publishes the AW3 wasm-builder image (misc/aw3/builder.Dockerfile):
# the engine source with a warm web object tree + emsdk + .NET 9/wasm-tools +
# the headless Linux editor, so the aw3 repo's web-build workflow can run the
# two-pass AOT export as a container job.
#
# Manual dispatch only: the image embeds the engine at this ref, and rebuilding
# it is expensive (a full editor + web template build). Re-run it whenever the
# engine moves; the aw3 workflow picks images by tag (sha or latest).
name: aw3-wasm-builder image

# workflow_dispatch never registers here because the repo is a fork whose
# default branch is upstream's master — the push trigger (scoped to the image's
# own inputs) is what actually runs this.
on:
  workflow_dispatch:
  push:
    branches: [aw-web-export, aw-wasm-builder]
    paths:
      - "misc/aw3/**"
      - ".github/workflows/aw3-builder-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: avrea-ubuntu-latest-2-vcpu
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Runner disk before
        run: df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/aw3/builder.Dockerfile
          push: true
          tags: |
            ghcr.io/studfarmstudios/aw3-wasm-builder:${{ github.sha }}
            ghcr.io/studfarmstudios/aw3-wasm-builder:latest

      - name: Runner disk after
        if: always()
        run: df -h /
