name: Build Godot
description: Build Godot with the provided options.

inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: editor
    type: choice
    options: [editor, template_debug, template_release]
  platform:
    description: Target platform.
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string

runs:
  using: composite
  steps:
    - name: SCons Build
      shell: sh
      run: |
        echo "Building with flags:" platform=${{ inputs.platform }} target=${{ inputs.target }} ${{ inputs.scons-flags }} "cache_path=${{ inputs.scons-cache }}" redirect_build_objects=no

        # WebGPU hashes its native sidecar serializer as part of the shared
        # translator/profile identity. Template SCons targets still exclude
        # editor object code, but that source must remain available to hash.
        case " ${{ inputs.scons-flags }} " in
          *" webgpu=yes "*|*" webgpu=true "*|*" webgpu=1 "*) preserve_editor_source=true ;;
          *) preserve_editor_source=false ;;
        esac
        if [ "${{ inputs.target }}" != "editor" ] && [ "$preserve_editor_source" = "false" ]; then
          # Ensure we don't include editor code in other export template builds.
          rm -rf editor
        fi

        if [ "${{ github.event.number }}" != "" ]; then
          # Set build identifier with pull request number if available. This is displayed throughout the editor.
          export BUILD_NAME="gh-${{ github.event.number }}"
        else
          export BUILD_NAME="gh"
        fi

        scons platform=${{ inputs.platform }} target=${{ inputs.target }} ${{ inputs.scons-flags }} "cache_path=${{ inputs.scons-cache }}" redirect_build_objects=no
        ls -l bin/
